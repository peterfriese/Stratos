# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: "Stratos Skill Evaluation Suite (Baseline vs. Domain Skill Only vs. Full Stratos)"

prompts:
  - id: file://prompts/build-prompt.js:baseline
    label: "1. Baseline (No Skill)"
  - id: file://prompts/build-prompt.js:domainOnly
    label: "2. Domain Skill Only (Standalone)"
  - id: file://prompts/build-prompt.js:stratosFull
    label: "3. Full Stratos (stratos-core + Domain Skill)"

# Default provider — uses Vertex AI Gemini 3 Flash via GOOGLE_APPLICATION_CREDENTIALS / GOOGLE_CLOUD_PROJECT.
# Run `npm run eval:pro` to evaluate against `vertex:gemini-3.1-pro-preview`, or pass `-p <provider>` on the CLI.
providers:
  - id: vertex:gemini-3-flash-preview
    label: "gemini-3-flash-preview"
    config:
      region: global
      temperature: 0.2

defaultTest:
  options:
    provider:
      id: vertex:gemini-3-flash-preview
      config:
        region: global
        temperature: 0.0

tests:
  - file://tests/core.yaml
  - file://tests/swiftui.yaml
  - file://tests/swift.yaml

outputPath: ./output/latest.json
